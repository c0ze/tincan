version: 2
project_name: tincan

builds:
  - main: ./cmd/tincan
    ldflags:
      - -s -w -X github.com/c0ze/tincan/internal/buildinfo.Version={{.Tag}} -X github.com/c0ze/tincan/internal/buildinfo.Commit={{.FullCommit}} -X github.com/c0ze/tincan/internal/buildinfo.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
