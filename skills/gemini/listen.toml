# tincan listener command for Gemini CLI (and Antigravity, if it reads
# gemini-style custom commands). Install to ~/.gemini/commands/listen.toml
# → invoke as /listen [name]
description = "Park on this repo's tincan inbox and answer requests from an orchestrator agent."
prompt = """
Act as a tincan listener for this repo. tincan is a local message-passing CLI
(on PATH; also ~/.local/bin/tincan).

Your name: use "{{args}}" if non-empty, else "gemini".
Resolve the room once: ROOM="$(git rev-parse --show-toplevel)". tincan does not
auto-climb to the repo root — always pass --room "$ROOM".

This is an AGENT-level loop (you act between commands), not a shell `while true`:

1. Run: tincan recv --as <name> --room "$ROOM" --timeout 0 --format json
   It blocks until a message arrives. Use a background or long-running call.
   Only use a positive timeout if the harness caps foreground calls and cannot
   background them; size it below that cap. Keep JSON output to see kind/reply_to.
2. Exit code 3 = timeout, no message: run step 1 again. Do not stop to report status.
3. On a message (JSON on stdout), inspect kind first. If kind == "stop", briefly
   acknowledge in chat and exit the loop without replying or re-arming. An
   absent/empty kind is ordinary work: body is your task; note reply_to (r-<hex>).
   Ignore unknown kinds. Do the task. Keep answers concise.
4. If reply_to is present, reply: tincan reply --room "$ROOM" --channel <reply_to> --from <name> --body-file answer.md
   (long answers: write a file and use --body-file; produced files: --artifact <path>).
5. Go to step 1. Loop until the user stops you.
"""
