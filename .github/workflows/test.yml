name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Reusable release checks test the caller's exact tagged commit.
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Installer regression tests
        if: runner.os != 'Windows' && matrix.go == 'stable'
        run: bash tests/install_test.sh
      - name: Spool stress (macOS/Windows)
        # Concurrency races differ per fs backend (kqueue EBADF/ENOENT churn,
        # Windows handle-based renames); Linux/inotify alone would miss them.
        if: runner.os != 'Linux' && matrix.go == 'stable'
        run: go test ./internal/spool/ -race -count=10
